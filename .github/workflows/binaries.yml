name: Binaries

# Standalone executables (no Node.js needed) for macOS, Linux and Windows.
# Pull requests build and smoke-test them on each OS; a published release,
# or a manual run with a tag, also uploads them and install.sh / install.ps1
# to dl.stackguardian.io and attaches them to that GitHub Release with build
# provenance. The npm package is published separately by release.yml.

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the binaries for (e.g. v0.1.0). Leave empty to only build and test."
        required: false
        default: ""

concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # The Bun runtime is compiled into every binary, so it is pinned.
  BUN_VERSION: "1.4.2"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        if: env.TAG != ''
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$version'"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies (no lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint install.sh
        run: shellcheck --shell=sh install.sh

      - name: Compile and package every target
        run: |
          set -euo pipefail
          mkdir -p release
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-x64; do
            # x64 uses Bun's baseline build so CPUs and VMs without AVX2 can run it.
            bun_target="bun-$target"
            [[ "$target" == *-x64 ]] && bun_target="$bun_target-baseline"
            exe=add-sg-mcp
            [[ "$target" == windows-* ]] && exe=add-sg-mcp.exe
            dir="build/$target"
            mkdir -p "$dir"
            bun run build:binary --target="$bun_target" --outfile="$dir/$exe"
            cp LICENSE NOTICE "$dir/"
            if [[ "$target" == windows-* ]]; then
              (cd "$dir" && zip -q "../../release/add-sg-mcp-$target.zip" "$exe" LICENSE NOTICE)
            else
              tar -czf "release/add-sg-mcp-$target.tar.gz" -C "$dir" "$exe" LICENSE NOTICE
            fi
          done
          cp install.sh install.ps1 release/
          (cd release && sha256sum add-sg-mcp-* install.sh install.ps1 > SHA256SUMS && cat SHA256SUMS)

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: release/
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-latest, archive: tar.gz }
          - { target: darwin-x64, runner: macos-15-intel, archive: tar.gz }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, archive: tar.gz }
          - { target: linux-x64, runner: ubuntu-latest, archive: tar.gz }
          - { target: windows-x64, runner: windows-latest, archive: zip }
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: add-sg-mcp-${{ matrix.target }}.${{ matrix.archive }}
      # Smoke tests must not land in the product analytics.
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: release

      - name: Verify checksum
        working-directory: release
        run: |
          set -euo pipefail
          line="$(awk -v f="$ARCHIVE" '$2 == f' SHA256SUMS)"
          [ -n "$line" ] || { echo "::error::$ARCHIVE is not in SHA256SUMS"; exit 1; }
          if command -v sha256sum >/dev/null; then
            echo "$line" | sha256sum -c -
          else
            echo "$line" | shasum -a 256 -c -
          fi

      - name: Unpack (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: mkdir bin && tar -xzf "release/$ARCHIVE" -C bin

      - name: Unpack (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Expand-Archive -Path "release/$env:ARCHIVE" -DestinationPath bin

      # Bun only runs the test harness; the binary under test is standalone.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run the binary
        env:
          ADD_SG_MCP_BINARY: bin/add-sg-mcp${{ matrix.target == 'windows-x64' && '.exe' || '' }}
        run: bun tests/e2e/sg-binary.test.ts

      - name: Run the install script
        env:
          ADD_SG_MCP_RELEASE_DIR: release
        run: bun tests/e2e/sg-install-script.test.ts

  publish:
    name: Publish
    needs: smoke
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The AWS role below trusts this environment only. It accepts v* tags and
    # waits for a reviewer, so a manual run must start from the tag.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: release

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::476299211833:role/gha-add-sg-mcp-release
          aws-region: eu-central-1

      # The install scripts download from here, so it is filled before the
      # GitHub Release gets the new scripts.
      - name: Upload to dl.stackguardian.io
        env:
          GH_TOKEN: ${{ github.token }}
          BUCKET: stackguardian-downloads-prod
        run: |
          set -euo pipefail
          version="v${TAG#v}"
          put() { # put FILE KEY CACHE_CONTROL [put-object option]
            local type="text/plain; charset=utf-8"
            case "$1" in
              *.tar.gz) type=application/gzip ;;
              *.zip) type=application/zip ;;
            esac
            aws s3api put-object --bucket "$BUCKET" --key "add-sg-mcp/$2" --body "$1" \
              --content-type "$type" --cache-control "$3" "${@:4}" >/dev/null
          }

          # Release files are cached for a year, so one that is already there
          # is never replaced. That is fine when it is this build (a re-run of
          # this job) and an error when it is not: a rebuild has different bytes.
          for file in release/*; do
            key="$version/$(basename "$file")"
            if ! error="$(put "$file" "$key" "public, max-age=31536000, immutable" --if-none-match '*' 2>&1)"; then
              grep -q PreconditionFailed <<<"$error" || { echo "$error" >&2; exit 1; }
              if ! curl -fsSL --retry 3 "https://dl.stackguardian.io/add-sg-mcp/$key" | cmp -s - "$file"; then
                echo "::error::$key is already published with different contents. A published version cannot be rebuilt; release a new version."
                exit 1
              fi
            fi
          done

          # `latest` and the scripts follow GitHub's latest release, so publishing
          # an older tag again does not move them. The pointer goes last.
          if [ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG" ]; then
            printf '%s\n' "$version" > latest
            for file in release/install.sh release/install.ps1 latest; do
              put "$file" "$(basename "$file")" "public, max-age=300"
            done
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
